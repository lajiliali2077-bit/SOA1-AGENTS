services:
  db:
    image: postgres:17
    container_name: copilot-db
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot_dev}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Facultatif : démarrer avec « docker compose up -d n8n », puis ouvrir http://localhost:5678
  n8n:
    image: n8nio/n8n
    container_name: copilot-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_SYNC_TOKEN: ${N8N_SYNC_TOKEN:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: Africa/Tunis
    volumes:
      - n8ndata:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Facultatif : webhook GitHub réel. « docker compose --profile github up -d »,
  # puis lire l'adresse publique avec « docker logs copilot-tunnel ».
  # Seul POST /webhook/github-sync est exposé ; l'interface n8n reste privée.
  webhook-proxy:
    image: nginx:alpine
    container_name: copilot-webhook-proxy
    profiles: ["github"]
    volumes:
      - ./n8n/webhook-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - n8n

  tunnel:
    image: cloudflare/cloudflared
    container_name: copilot-tunnel
    profiles: ["github"]
    command: tunnel --no-autoupdate --url http://webhook-proxy:80
    depends_on:
      - webhook-proxy

volumes:
  pgdata:
  n8ndata:
