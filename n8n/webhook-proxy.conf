# Proxy exposé sur Internet par le tunnel Cloudflare (docker compose --profile github).
# Il ne laisse passer que le webhook GitHub : l'interface n8n reste privée.
server {
    listen 80;
    client_max_body_size 5m;

    location = /webhook/github-sync {
        limit_except POST { deny all; }
        proxy_pass http://n8n:5678/webhook/github-sync;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}
