# Catalogue d'outils du département HR (version minimale, à compléter par l'équipe).
# mode : read (lecture seule) ou write (modifie des données ou crée un document)

- name: get_candidates
  description: "List the candidates of one job opening with identifier, skills, years of experience, CV summary and application status. Contact details are not returned."
  mode: read
  departments: [hr]
  parameters:
    - {name: job_id, type: string, required: true, description: "Job opening identifier, for example JOB-2026-014."}
    - {name: status, type: string, required: false, enum: [new, shortlisted, interviewed, rejected], description: "Filter on the application status."}
    - {name: min_experience_years, type: integer, required: false, description: "Only candidates with at least this many years of experience."}
    - {name: limit, type: integer, required: false, description: "Maximum number of candidates returned, default 20, maximum 100."}

- name: get_calendar
  description: "Get the free time slots of one person over a period, based on the working calendar. Used to plan interviews."
  mode: read
  departments: [hr]
  parameters:
    - {name: participant_id, type: string, required: true, description: "Employee identifier of the interviewer."}
    - {name: date_from, type: string, required: true, description: "Start of the period, format YYYY-MM-DD."}
    - {name: date_to, type: string, required: true, description: "End of the period, format YYYY-MM-DD."}
    - {name: slot_minutes, type: integer, required: false, description: "Minimum length of a free slot in minutes, default 60."}

- name: get_payslip
  description: "Get one monthly payslip: gross salary, overtime hours and amount, bonuses, social contributions, tax withholding and net pay, in TND."
  mode: read
  departments: [hr]
  parameters:
    - {name: employee_id, type: string, required: true, description: "Employee identifier."}
    - {name: month, type: string, required: true, description: "Payslip month, format YYYY-MM."}

- name: get_contract
  description: "Get the active contract terms of one employee: contract type, start date, base monthly salary in TND, weekly hours and overtime rate."
  mode: read
  departments: [hr]
  parameters:
    - {name: employee_id, type: string, required: true, description: "Employee identifier."}