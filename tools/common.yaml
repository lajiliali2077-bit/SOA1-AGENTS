# Outils communs à tous les départements.

- name: calculate
  description: "Compute an arithmetic expression with numbers, + - * / and parentheses, for example 2 * 39.5 + 40. Use it instead of computing by hand."
  mode: read
  departments: [customer-service, finance, hr, inventory, compliance]
  parameters:
    - {name: expression, type: string, required: true, description: "Expression to compute."}
