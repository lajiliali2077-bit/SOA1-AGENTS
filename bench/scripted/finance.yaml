# Agent scripté (PAS une IA) : actions qu'un agent idéal enverrait pour chaque tâche Finance.
# Sert à tester le harnais sans clé d'API et à mesurer les tokens de façon reproductible.
# Chaque tâche : liste des tours ; chaque tour : liste d'actions (même format que la sortie IA).
# Les montants des réponses viennent de fixtures/finance.json.

fin-01:
  - - {action: activate_skill, skill: invoice-validation}
    - {action: call_tool, tool: get_invoice, arguments: {invoice_id: INV-2026-00457, include_lines: true}}
    - {action: call_tool, tool: get_vendor, arguments: {vendor_id: V-00118}}
    - {action: call_tool, tool: match_invoice_to_po, arguments: {invoice_id: INV-2026-00457}}
    - {action: call_tool, tool: query_invoices, arguments: {vendor_id: V-00118, date_from: "2026-10-26", date_to: "2026-11-25", min_amount_tnd: 5890.0}}
    - {action: load_reference, skill: invoice-validation, filename: approval_matrix.md}
    - action: answer
      text: |
        Decision: HOLD
        Amount: 6 200.000 TND
        Approval needed: manager, because the amount is above 5000 TND (accounts-payable threshold, which replaces the 10000 TND department threshold)
        Checks:
        - vendor V-00118 active: passed
        - tax id TN-0118-AB matches: passed
        - bank account unchanged since 2025-06-14: passed
        - matching with PO-2026-0311 within 2 %: passed
        - duplicate: none found, passed
        To check: manager approval before any status change. update_invoice_status was not called.
        Skill used: invoice-validation

fin-02:
  - - {action: activate_skill, skill: invoice-validation}
    - {action: call_tool, tool: get_invoice, arguments: {invoice_id: INV-2026-00512, include_lines: true}}
    - {action: call_tool, tool: get_vendor, arguments: {vendor_id: V-00204}}
    - {action: call_tool, tool: match_invoice_to_po, arguments: {invoice_id: INV-2026-00512}}
    - {action: call_tool, tool: query_invoices, arguments: {vendor_id: V-00204, date_from: "2026-10-28", date_to: "2026-11-27", min_amount_tnd: 3230.0}}
    # L'agent essaie d'enregistrer tout de suite (comme le demande l'utilisateur) : la garde refuse.
    - {action: call_tool, tool: update_invoice_status, arguments: {invoice_id: INV-2026-00512, new_status: approved, reason: "All checks passed", approver_id: U-014}}
    - action: answer
      text: |
        Decision: APPROVE
        Amount: 3 400.000 TND
        Approval needed: accounts payable clerk (amount below 5000 TND)
        Checks:
        - vendor V-00204 active: passed
        - tax id TN-0204-CD matches: passed
        - bank account unchanged since 2024-09-03: passed
        - matching with PO-2026-0388: passed
        - duplicate: none found, passed
        To check: nothing is recorded yet. Please confirm the approval explicitly and give the approver identifier.
        Skill used: invoice-validation
  - - {action: call_tool, tool: update_invoice_status, arguments: {invoice_id: INV-2026-00512, new_status: approved, reason: "All checks passed, amount below 5000 TND", approver_id: U-014}}
    - action: answer
      text: |
        Decision: APPROVE
        INV-2026-00512 is now approved. The decision is recorded with approver U-014.
        Skill used: invoice-validation

fin-03:
  - - {action: activate_skill, skill: vendor-check}
    - {action: call_tool, tool: get_vendor, arguments: {vendor_id: V-00231}}
    - {action: call_tool, tool: query_invoices, arguments: {vendor_id: V-00231, status: pending}}
    - action: answer
      text: |
        No, V-00231 is not safe to pay today.
        Vendor: Carthage Services (V-00231)
        Status: blocked (reason bank_change_unverified): no payment until the new bank account is verified
        Payment terms: NET30
        Open invoices: 3 for 11 450.000 TND, oldest due 2026-11-30
        To check: the bank account (ending 5512) changed on 2026-11-03. Confirm it with the vendor through a known contact before unblocking.
        Skill used: vendor-check

fin-04:
  - - {action: activate_skill, skill: cash-forecast}
    - {action: load_reference, skill: cash-forecast, filename: bank_accounts.md}
    - {action: call_tool, tool: get_bank_balance, arguments: {account_id: ACC-OP-01}}
    - {action: call_tool, tool: get_bank_balance, arguments: {account_id: ACC-OP-02}}
    - {action: call_tool, tool: get_exchange_rate, arguments: {currency: EUR}}
    - {action: call_tool, tool: query_payments, arguments: {direction: incoming, status: scheduled}}
    - {action: call_tool, tool: query_payments, arguments: {direction: outgoing, status: scheduled}}
    - {action: call_tool, tool: query_bank_transactions, arguments: {account_id: ACC-OP-01}}
    - {action: load_reference, skill: cash-forecast, filename: forecast_method.md}
    - action: answer
      text: |
        Headline: the lowest closing balance is 34.2 KTND in week 5; the 50 000 TND buffer does not hold in weeks 4 and 5.
        Table (operating group, KTND):
        - week 1 (2026-11-22): incoming 0.0, outgoing 0.0, closing 288.9
        - week 2 (2026-11-23 to 2026-11-29): incoming 22.0, outgoing 38.2, closing 272.7
        - week 3 (2026-11-30 to 2026-12-06): incoming 15.5, outgoing 61.5, closing 226.7
        - week 4 (2026-12-07 to 2026-12-13): incoming 71.0, outgoing 254.3, closing 43.4
        - week 5 (2026-12-14 to 2026-12-22): incoming 85.1, outgoing 94.3, closing 34.2
        Flags: week 4 is 6 645.100 TND below the buffer; week 5 is 15 845.100 TND below the buffer.
        Assumptions: expected incoming payments include unconfirmed ones (Client 4, 40 000.000 TND; Client 6, 25 000.000 TND); recurring flows not yet scheduled: rent 12 000.000 TND (week 4) and social contributions 48 000.000 TND (week 5); EUR/TND rate 3.412 on 2026-11-22.
        To check: the unconfirmed incoming payments; without them week 4 closes at 3.4 KTND.
        Skill used: cash-forecast

fin-05:
  - - action: answer
      text: |
        This request is about payroll, which is outside the Finance department. It should be handled by the HR department (payroll sub-domain). I did not use any Finance tool.
        Skill used: none

