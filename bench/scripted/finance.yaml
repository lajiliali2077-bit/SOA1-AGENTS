  - - {action: activate_skill, skill: invoice-validation}
    - {action: call_tool, tool: get_invoice, arguments: {invoice_id: INV-2026-00733, include_lines: true}}
    - {action: call_tool, tool: get_vendor, arguments: {vendor_id: V-00118}}
    - {action: call_tool, tool: match_invoice_to_po, arguments: {invoice_id: INV-2026-00733}}
    - {action: call_tool, tool: query_invoices, arguments: {vendor_id: V-00118, date_from: "2026-10-31", date_to: "2026-11-30", min_amount_tnd: 20751.051}}
    - action: answer
      text: |
        Decision: REJECT
        Amount: 21 843.212 TND
