id: fin-04
department: finance
title: Prévision de trésorerie, résumé en KTND (règle surchargée de treasury)
expected_skill: cash-forecast
trap: none
overridden_rule: "treasury : résumés en KTND avec 1 décimale (remplace les 3 décimales du département pour les résumés)"
turns:
  - user: "Quelle est notre position de trésorerie sur les 30 prochains jours ?"
tool_results:
  get_bank_balance: "ACC-OP-01 : 182400.500 TND disponibles ; ACC-OP-02 : 31200.000 EUR disponibles"
  query_payments: "sorties programmées sur 30 jours ; les semaines 4 et 5 se terminent sous le tampon de 50000 TND (voir fixtures/finance.json)"
  query_bank_transactions: "30 derniers jours : loyer et cotisations récurrents non encore programmés"
  get_exchange_rate: "EUR/TND à la date de départ"
checks:
  - {check: skill_activated, skill: cash-forecast}
  - {check: text_matches, pattern: "\\d+\\.\\d KTND"}
  - {check: text_matches, pattern: "50\\s?000"}
  - {check: text_contains, value: "expected"}
  - {check: tool_not_called, tool: update_invoice_status}
  - {check: text_matches, pattern: "Skill used: cash-forecast\\s*$"}
